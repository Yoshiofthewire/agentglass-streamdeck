# agentglass-streamdeck configuration.
#
# Copy to config.toml (which is gitignored — it may hold a token) or pass a path
# with --config. Every field is optional; the defaults below match a stock
# agentglass on the same machine. Environment variables win over this file:
#   AGENTGLASS_SERVER   -> server
#   AGENTGLASS_TOKEN    -> token

# Where agentglass is listening. The daemon speaks HTTP + the /stream WebSocket.
server = "http://127.0.0.1:4000"

# Shared secret, only if you set AGENTGLASS_TOKEN on the server. Sent as
# `Authorization: Bearer <token>` on every request and `?token=` on the socket.
# token = "..."

# Deck backlight, 0–100.
brightness = 60

# How often (seconds) the daemon polls the REST reads it can't get from the
# socket — pending approvals, stats, insights. The /stream socket drives
# everything else live; this is the floor, not the resolution.
poll_interval = 2.0

# Dim the deck to this brightness (0–100) after `idle_after` seconds with no
# fleet activity and no pending approvals; a new event or approval wakes it.
idle_brightness = 15
idle_after = 90.0
